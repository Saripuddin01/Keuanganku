name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Siapkan Project & Instal Capacitor
      run: |
        # Buat folder www dan pindahkan file web ke dalamnya
        mkdir -p www
        rsync -av --exclude='www' --exclude='.git' --exclude='.github' . www/
        
        # Buat package.json manual agar terhindar dari error nama kapital
        echo '{"name":"dompetku-app","version":"1.0.0"}' > package.json
        
        # Kunci versi Capacitor di v6 agar stabil
        npm install @capacitor/core@6 @capacitor/android@6
        npm install -D @capacitor/cli@6
        
        # Inisialisasi
        npx cap init "DompetKu" "com.syarif.dompetku" --web-dir www

    - name: Ubah Web Jadi Android
      run: |
        npx cap add android
        npx cap sync

    - name: Rakit File APK (Build)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Serahkan APK ke Pengguna
      uses: actions/upload-artifact@v4
      with:
        name: DompetKu-App
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
